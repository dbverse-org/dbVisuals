on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', needs: 'check'}
          - {os: windows-latest, r: 'release', needs: 'check'}
          - {os: ubuntu-latest,   r: 'devel', needs: 'check-light', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release', needs: 'check'}
          - {os: ubuntu-latest,   r: 'oldrel-1', needs: 'check'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: any::rcmdcheck
          needs: ${{ matrix.config.needs }}
          dependencies: '"hard"'

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package
          upload-snapshots: true
