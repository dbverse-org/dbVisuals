url: https://dbverse-org.github.io/dbVisuals/
destination: pkgdown
template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "dbVisuals: Database-Powered Visualizations for Tabular Data"
  description: >
    A browser workspace and an R htmlwidget for linked, database-backed visualizations of DuckDB, dbverse and other tabular data.

# Footer and sidebar list the people who built and reviewed the package; the
# funder stays in DESCRIPTION.
authors:
  footer:
    roles: [aut, cre]
  sidebar:
    roles: [aut, cre, rev]

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, webapp, github]
  components:
    webapp:
      text: Web App
      icon: fa-arrow-up-right-from-square
      href: https://dbvisuals.pages.dev/
      aria-label: Open the dbVisuals web app
    home: ~
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Linked visualization examples
        href: articles/visualization-examples.html
      - text: Reproducing the paper figures
        href: articles/reproducing-paper-figures.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/dbverse-org/dbVisuals
      aria-label: GitHub

reference:
  - title: "Main Functions"
    desc: "Core SQL Rooms functionality"
    contents:
      - launchBrowser
      - stop_sqlrooms
      - sqlrooms_export_table
      - sqlrooms_register
      - dbvisuals_export_htmlwidget
  - title: "Linked R viewer"
    desc: "Mosaic views and deck.gl layers in one linked htmlwidget"
    contents:
      - mosaic_gl
      - mgl_spec
      - mgl_data
      - mgl_deckgl
      - mosaic_glOutput
      - renderMosaic_gl
  - title: "Installation Helpers"
    desc: "Dependency management"
    contents:
      - install_dbvisuals_deps

